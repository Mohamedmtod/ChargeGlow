workflows:
  chargeglow-feasibility:
    name: ChargeGlow Phase 2 Engineering
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - ChargeGlow
      # Codemagic maps 26.4 to Xcode 26.4.1. The first script verifies the
      # exact patch release so the workflow fails instead of silently drifting.
      xcode: 26.4
      vars:
        XCODE_PROJECT: ChargeGlow.xcodeproj
        XCODE_SCHEME: ChargeGlow

    scripts:
      - name: Verify pinned Xcode and project
        script: |
          set -euo pipefail
          XCODE_VERSION="$(xcodebuild -version | head -n 1)"
          if [ "$XCODE_VERSION" != "Xcode 26.4.1" ]; then
            echo "Expected Xcode 26.4.1, found: $XCODE_VERSION"
            exit 1
          fi
          xcodebuild -list \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT"

      - name: Stamp visible build identity
        script: |
          set -euo pipefail
          APP_PLIST="$CM_BUILD_DIR/ChargeGlow/Resources/Info.plist"
          WIDGET_PLIST="$CM_BUILD_DIR/ChargeGlowWidgets/Info.plist"
          GIT_COMMIT="$(git rev-parse --short=8 HEAD)"
          CI_BUILD_ID="${CM_BUILD_ID:-unknown}"
          CI_BUILD_NUMBER="${BUILD_NUMBER:-2}"

          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $CI_BUILD_NUMBER" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $CI_BUILD_NUMBER" "$WIDGET_PLIST"
          /usr/libexec/PlistBuddy -c "Set :ChargeGlowGitCommit $GIT_COMMIT" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Set :ChargeGlowCIBuildID $CI_BUILD_ID" "$APP_PLIST"

          echo "ChargeGlow 1.3.0 ($CI_BUILD_NUMBER)"
          echo "Git commit: $GIT_COMMIT"
          echo "Codemagic build ID: $CI_BUILD_ID"

      - name: Validate English and Arabic string catalogs
        script: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          catalogs = (
              Path("ChargeGlow/Resources/Localizable.xcstrings"),
              Path("ChargeGlow/Resources/AppShortcuts.xcstrings"),
          )

          for path in catalogs:
              data = json.loads(path.read_text(encoding="utf-8"))
              if data.get("sourceLanguage") != "en":
                  raise SystemExit(f"{path}: sourceLanguage must be en")
              strings = data.get("strings", {})
              if not strings:
                  raise SystemExit(f"{path}: catalog is empty")

              for key, entry in strings.items():
                  unit = (
                      entry.get("localizations", {})
                      .get("ar", {})
                      .get("stringUnit", {})
                  )
                  if unit.get("state") != "translated" or not unit.get("value"):
                      raise SystemExit(
                          f"{path}: missing Arabic translation for {key!r}"
                      )

              print(f"Validated {path}: {len(strings)} translated strings")
          PY

      - name: Run unit tests without signing
        script: |
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/test-results"
          xcodebuild test \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 17 Pro,OS=26.4.1" \
            -resultBundlePath "$CM_BUILD_DIR/test-results/ChargeGlowTests.xcresult" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$CM_BUILD_DIR/test-results/xcodebuild-test.log" \
            | xcbeautify

      - name: Build unsigned device application
        script: |
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build"
          xcodebuild clean build \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$CM_BUILD_DIR/build/device" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            | tee "$CM_BUILD_DIR/test-results/xcodebuild-device.log" \
            | xcbeautify

      - name: Verify Live Activity payload
        script: |
          set -euo pipefail
          APP_PATH="$CM_BUILD_DIR/build/device/Build/Products/Release-iphoneos/ChargeGlow.app"
          WIDGET_PATH="$APP_PATH/PlugIns/ChargeGlowWidgets.appex"

          test -d "$APP_PATH"
          test -d "$WIDGET_PATH"
          test -f "$WIDGET_PATH/Info.plist"

          APP_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          WIDGET_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$WIDGET_PATH/Info.plist")"
          SUPPORTS_LIVE_ACTIVITIES="$(/usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$APP_PATH/Info.plist")"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          APP_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          APP_COMMIT="$(/usr/libexec/PlistBuddy -c 'Print :ChargeGlowGitCommit' "$APP_PATH/Info.plist")"
          APP_CI_BUILD_ID="$(/usr/libexec/PlistBuddy -c 'Print :ChargeGlowCIBuildID' "$APP_PATH/Info.plist")"

          test "$APP_BUNDLE_ID" = "com.mohamedalaa.chargeglow"
          test "$WIDGET_BUNDLE_ID" = "com.mohamedalaa.chargeglow.widgets"
          test "$SUPPORTS_LIVE_ACTIVITIES" = "true"
          test "$APP_VERSION" = "1.3.0"
          test "$APP_COMMIT" = "$(git rev-parse --short=8 HEAD)"
          test "$APP_CI_BUILD_ID" = "${CM_BUILD_ID:-unknown}"

          echo "Verified app bundle: $APP_BUNDLE_ID"
          echo "Verified widget bundle: $WIDGET_BUNDLE_ID"
          echo "Verified build identity: $APP_VERSION ($APP_BUILD) • $APP_COMMIT • CI $APP_CI_BUILD_ID"
          echo "App Intents metadata discovered at:"
          find "$APP_PATH" -iname '*appintents*' -print || true

      - name: Package unsigned IPA for iLoader
        script: |
          set -euo pipefail
          APP_PATH="$CM_BUILD_DIR/build/device/Build/Products/Release-iphoneos/ChargeGlow.app"
          PACKAGE_ROOT="$CM_BUILD_DIR/build/unsigned-package"
          ARTIFACTS_DIR="$CM_BUILD_DIR/artifacts"

          rm -rf "$PACKAGE_ROOT"
          mkdir -p "$PACKAGE_ROOT/Payload" "$ARTIFACTS_DIR"
          ditto "$APP_PATH" "$PACKAGE_ROOT/Payload/ChargeGlow.app"

          cd "$PACKAGE_ROOT"
          zip -qry "$ARTIFACTS_DIR/ChargeGlow-Spike-unsigned.ipa" Payload
          shasum -a 256 "$ARTIFACTS_DIR/ChargeGlow-Spike-unsigned.ipa" \
            > "$ARTIFACTS_DIR/ChargeGlow-Spike-unsigned.ipa.sha256"

      - name: Publish GitHub Release
        script: |
          set -euo pipefail
          : "${GITHUB_TOKEN:?GITHUB_TOKEN is required from the ChargeGlow group}"

          APP_PATH="$CM_BUILD_DIR/build/device/Build/Products/Release-iphoneos/ChargeGlow.app"
          IPA_PATH="$CM_BUILD_DIR/artifacts/ChargeGlow-Spike-unsigned.ipa"
          CHECKSUM_PATH="$CM_BUILD_DIR/artifacts/ChargeGlow-Spike-unsigned.ipa.sha256"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          APP_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          RELEASE_TAG="dev-latest"
          RELEASE_TITLE="ChargeGlow Latest Development Build"
          TARGET_COMMIT="$(git rev-parse HEAD)"
          REPOSITORY="${CM_REPO_SLUG:-Mohamedmtod/ChargeGlow}"
          RELEASE_NOTES="$(printf 'Version: %s\nBuild: %s\nCommit: %s' \
            "$APP_VERSION" "$APP_BUILD" "$TARGET_COMMIT")"

          export GH_TOKEN="$GITHUB_TOKEN"

          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$REPOSITORY" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES"
            gh release upload "$RELEASE_TAG" \
              "$IPA_PATH#ChargeGlow-Spike-unsigned.ipa" \
              "$CHECKSUM_PATH#ChargeGlow-Spike-unsigned.ipa.sha256" \
              --repo "$REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$IPA_PATH#ChargeGlow-Spike-unsigned.ipa" \
              "$CHECKSUM_PATH#ChargeGlow-Spike-unsigned.ipa.sha256" \
              --repo "$REPOSITORY" \
              --target "$TARGET_COMMIT" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES"
          fi

    artifacts:
      - artifacts/ChargeGlow-Spike-unsigned.ipa
      - artifacts/ChargeGlow-Spike-unsigned.ipa.sha256
      - test-results/*.log
      - test-results/*.xcresult
      - build/device/Build/Products/Release-iphoneos/ChargeGlow.app
